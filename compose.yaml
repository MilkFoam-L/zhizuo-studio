services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set an access password of at least 16 characters}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4317}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a 64-character hex encryption key}
    volumes:
      - studio-data:/app/.data
    restart: unless-stopped
volumes:
  studio-data:
