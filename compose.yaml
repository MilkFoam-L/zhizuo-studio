services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      AUTH_MODE: ${AUTH_MODE:-shared}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-管理员}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4317}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a 64-character hex encryption key}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-zhizuo/assets}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_DAILY_TASKS: ${MAX_DAILY_TASKS:-100}
      WORKER_MODE: ${WORKER_MODE:-inline}
    volumes:
      - studio-data:/app/.data
      # 自动化发布需要 MCP 与织作访问同一素材 staging 目录。
      - publish-staging:/app/.data/publish-staging
    restart: unless-stopped
  # 内置小红书发布通道：基于 xpzouying/xiaohongshu-mcp（已获作者授权内置）。
  # 首次使用需在织作「模型接入 → 发布通道」完成扫码登录；cookie 持久化在专用卷。
  xiaohongshu-mcp:
    image: xpzouying/xiaohongshu-mcp:latest
    ports:
      - "127.0.0.1:18060:18060"
    volumes:
      - xhs-mcp-data:/app/data
      # 与 studio 共享发布 staging，MCP 直接读取本机图片路径。
      - publish-staging:/app/.data/publish-staging
    restart: unless-stopped
volumes:
  studio-data:
  xhs-mcp-data:
  publish-staging:
