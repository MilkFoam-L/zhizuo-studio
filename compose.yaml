services:
  studio:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      AUTH_MODE: ${AUTH_MODE:-shared}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-管理员}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4317}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a 64-character hex encryption key}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-zhizuo/assets}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_DAILY_TASKS: ${MAX_DAILY_TASKS:-100}
      WORKER_MODE: ${WORKER_MODE:-inline}
    volumes:
      - studio-data:/app/.data
    restart: unless-stopped
volumes:
  studio-data:
